[package]
name = "focus-return-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "UI-independent timer, data model and local storage core for 다시, 집중 (focus-return)."
publish = false

[lib]
name = "focus_return_core"
path = "src/lib.rs"

# Kept deliberately small. serde/serde_json are already part of any Tauri 2 build,
# so they add no new dependency tree once this crate is linked into the app.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
