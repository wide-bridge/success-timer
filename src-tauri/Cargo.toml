[package]
name = "mokpyo-jipjung"
version = "0.1.2"
description = "Success Timer Windows desktop app"
authors = ["KH Cha"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "mokpyo_jipjung_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
focus-return-core = { path = "../backend" }


